version: "3.9"

services:
  # -------------------------------------------------------------------------
  # Local Llama 3 via Ollama
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: medirag_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # GPU support (uncomment for NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # -------------------------------------------------------------------------
  # FastAPI Backend
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medirag_backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./medirag.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3
      - CHROMA_PERSIST_DIRECTORY=/data/embeddings/vector_store/chroma_db
      - UPLOAD_BASE_DIR=/data/uploaded_documents
      - METADATA_DIR=/data/metadata
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-32chars!!}
      - DEBUG=false
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ./data:/data
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------------
  # Next.js Frontend
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medirag_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: medirag_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    name: medirag_ollama_data
  backend_logs:
    name: medirag_backend_logs
