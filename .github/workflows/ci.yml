name: MediRAG AI – CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Backend Tests
  # -------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio anyio

      - name: Create .env for testing
        run: cp .env.example .env

      - name: Run validation tests
        run: pytest app/tests/test_validation.py -v

      - name: Run chunker tests
        run: pytest app/tests/test_chunker.py -v

      - name: Run API tests
        run: pytest app/tests/test_api.py -v

  # -------------------------------------------------------------------------
  # Frontend Lint & Type-check
  # -------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  # -------------------------------------------------------------------------
  # Docker Build Check
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t medirag-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t medirag-frontend:${{ github.sha }} ./frontend
