services:
  - type: web
    name: medirag-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Render injects PORT automatically; uvicorn reads it via the CMD in Dockerfile.
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # --- Security (set real values in Render dashboard, not here) ---
      - key: SECRET_KEY
        sync: false   # marks as secret; fill in Render dashboard

      # --- Database ---
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./medirag.db

      # --- Groq LLM (replaces Ollama — free at console.groq.com) ---
      - key: GROQ_API_KEY
        sync: false   # set in Render dashboard
      - key: LLM_MODEL
        value: llama3-8b-8192

      # --- Embeddings ---
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DEVICE
        value: cpu

      # --- Vector Store ---
      - key: VECTOR_STORE_TYPE
        value: chroma
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/embeddings/vector_store/chroma_db

      # --- Document Storage ---
      - key: UPLOAD_BASE_DIR
        value: /data/uploaded_documents
      - key: METADATA_DIR
        value: /data/metadata
      - key: MAX_FILE_SIZE_MB
        value: "50"

      # --- CORS ---
      - key: ALLOWED_ORIGINS
        value: https://rag-based-medical-question-answerin.vercel.app,https://rag-based-medical-question-answering.vercel.app,http://localhost:3000

    disk:
      name: medirag-data
      mountPath: /data
      sizeGB: 1
